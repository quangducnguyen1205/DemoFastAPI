name: processor-ci

# Clean-checkout validation for the internal FastAPI processing service.
#
# Only checks this repository actually supports are run: the unittest suite, a byte-compile pass
# and static Compose rendering. The suite is intentionally offline — it must never contact real
# Kafka, PostgreSQL, Celery, MinIO or Ollama — so no secret and no service container is required.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: processor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: unit tests, compile and compose rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the whitespace gate below can diff against a real base commit.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Whitespace safety
        # Scoped to what this run introduces: the pull-request base for a PR, the previous commit
        # for a push. Pre-existing whitespace elsewhere in the tree is not this gate's business, so
        # a clean checkout always starts green.
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ] && git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          if [ -z "$base" ]; then
            echo 'No base commit to compare against; nothing introduced by this run.'
            exit 0
          fi
          git diff --check "$base" HEAD

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Byte-compile the application
        run: python -m compileall -q backend/app

      - name: Unit tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend -p 'test_*.py'

      - name: Compose configuration renders
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.project3.yml config --quiet
