services:
  backend:
    image: demofirstbackend-python:latest
    build:
      context: ./backend
      target: runtime
    ports:
      # Loopback only: the intended callers are the host-native Spring core and local
      # operator tooling, never arbitrary LAN clients.
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - redis
    environment:
      PYTHONPATH: /backend
      DATABASE_URL: ${DATABASE_URL}
      MEDIA_ROOT: /backend/media
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS:-12600}
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - ./backend:/backend
      - ./backend/media:/backend/media

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=userdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  youtube-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider@sha256:20bd6ad8561d71c628fb3d4fe35a7fcd2c9ef84eecd2bbf40f77dd0d8a8e3799
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - /usr/bin/deno
        - eval
        - const response = await fetch('http://127.0.0.1:4416/ping'); if (!response.ok) Deno.exit(1);
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: demofirstbackend-python:latest
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      youtube-pot-provider:
        condition: service_healthy
    environment:
      PYTHONPATH: /backend
      DATABASE_URL: ${DATABASE_URL}
      MEDIA_ROOT: /backend/media
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS:-12600}
      PROCESSING_LEASE_RETRY_POLL_SECONDS: ${PROCESSING_LEASE_RETRY_POLL_SECONDS:-300}
      PROCESSING_LEASE_SECONDS: ${PROCESSING_LEASE_SECONDS:-14400}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-http://host.docker.internal:9000}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      YOUTUBE_MAX_DURATION_SECONDS: ${YOUTUBE_MAX_DURATION_SECONDS:-7200}
      YOUTUBE_MAX_FILE_SIZE_BYTES: ${YOUTUBE_MAX_FILE_SIZE_BYTES:-1073741824}
      YOUTUBE_SOCKET_TIMEOUT_SECONDS: ${YOUTUBE_SOCKET_TIMEOUT_SECONDS:-30}
      YOUTUBE_ACQUISITION_TIMEOUT_SECONDS: ${YOUTUBE_ACQUISITION_TIMEOUT_SECONDS:-900}
      YOUTUBE_DOWNLOAD_RETRIES: ${YOUTUBE_DOWNLOAD_RETRIES:-2}
      YOUTUBE_PO_TOKEN_PROVIDER_URL: ${YOUTUBE_PO_TOKEN_PROVIDER_URL:-http://youtube-pot-provider:4416}
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - ./backend:/backend
      - ./backend/media:/backend/media
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-1}

  consumer:
    image: demofirstbackend-python:latest
    depends_on:
      - db
      - redis
    environment:
      PYTHONPATH: /backend
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS:-12600}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      KAFKA_ASSET_PROCESSING_TOPIC: ${KAFKA_ASSET_PROCESSING_TOPIC:-asset.processing.requested.v1}
      KAFKA_ASSET_PROCESSING_V2_TOPIC: ${KAFKA_ASSET_PROCESSING_V2_TOPIC:-asset.processing.requested.v2}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-fastapi-processing-v1}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      KAFKA_RECONNECT_BACKOFF_SECONDS: ${KAFKA_RECONNECT_BACKOFF_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - ./backend:/backend
    command: python -m app.consumers.asset_processing_consumer

  result-relay:
    image: demofirstbackend-python:latest
    profiles:
      - manual
    depends_on:
      - db
    environment:
      PYTHONPATH: /backend
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      KAFKA_PROCESSING_RESULT_TOPIC: ${KAFKA_PROCESSING_RESULT_TOPIC:-asset.processing.result.v1}
      KAFKA_SEND_TIMEOUT_SECONDS: ${KAFKA_SEND_TIMEOUT_SECONDS:-10}
      PROCESSING_RESULT_PUBLISHER_ENABLED: ${PROCESSING_RESULT_PUBLISHER_ENABLED:-false}
      PROCESSING_OUTBOX_RELAY_ENABLED: ${PROCESSING_OUTBOX_RELAY_ENABLED:-false}
      PROCESSING_OUTBOX_RELAY_BATCH_SIZE: ${PROCESSING_OUTBOX_RELAY_BATCH_SIZE:-10}
      PROCESSING_OUTBOX_RELAY_MAX_ATTEMPTS: ${PROCESSING_OUTBOX_RELAY_MAX_ATTEMPTS:-5}
      PROCESSING_OUTBOX_RELAY_RETRY_DELAY_SECONDS: ${PROCESSING_OUTBOX_RELAY_RETRY_DELAY_SECONDS:-60}
      PROCESSING_OUTBOX_RECOVERY_ENABLED: ${PROCESSING_OUTBOX_RECOVERY_ENABLED:-false}
      PROCESSING_OUTBOX_RECOVERY_INTERVAL_SECONDS: ${PROCESSING_OUTBOX_RECOVERY_INTERVAL_SECONDS:-30}
      PROCESSING_OUTBOX_RECOVERY_COOLDOWN_SECONDS: ${PROCESSING_OUTBOX_RECOVERY_COOLDOWN_SECONDS:-60}
      PROCESSING_OUTBOX_RECOVERY_BATCH_SIZE: ${PROCESSING_OUTBOX_RECOVERY_BATCH_SIZE:-50}
      PROCESSING_OUTBOX_RECOVERY_MAX_CYCLES: ${PROCESSING_OUTBOX_RECOVERY_MAX_CYCLES:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - ./backend:/backend
    command: python -m app.relays.processing_outbox_relay

volumes:
  postgres_data:
